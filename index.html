<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#176a60" />
<title>工时打卡</title>
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<style>
:root{
  --bg:#f6f7f6; --card:#ffffff; --text:#202826; --muted:#65716d;
  --primary:#176a60; --green:#21845b; --amber:#a96928; --red:#c74e46; --blue:#426d93;
  --border:#dfe5e1; --radius:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh; line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:520px;height:100dvh;min-height:520px;margin:0 auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:0 0 8px;flex:none}
h1{font-size:18px;margin:0;font-weight:700}
.header-tools{display:flex;align-items:center;gap:8px}
#clock{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;color:var(--muted)}
.tools-menu{position:relative;z-index:20}
.tools-menu summary{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);font-size:21px;line-height:1;cursor:pointer;list-style:none}
.tools-menu summary::-webkit-details-marker{display:none}
.tools-popover{position:absolute;right:0;top:40px;width:min(335px,calc(100vw - 28px));max-height:calc(100dvh - 58px);overflow:auto;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 12px 30px rgba(20,35,30,.15);padding:16px}
.tools-popover h2{margin:0 0 10px}
.overview{padding:0 2px 10px;border-bottom:1px solid var(--border);margin-bottom:8px;flex:none}
.stats-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.stats-head h2{margin:0}
.month-control{display:flex;align-items:center;gap:2px}
.month-nav{width:28px;height:28px;min-height:28px;padding:0;background:transparent;color:var(--muted);font-size:20px;line-height:1}
.range-select{width:106px;border:0;background:transparent;color:var(--text);font-size:13px;font-weight:600;padding:3px 0}
.overview-hours{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;align-items:end}
.overview-hours>div+div{border-left:1px solid var(--border);padding-left:12px}
.overview-value{display:block;font-size:27px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.overview-value small{font-size:11px;font-weight:500;color:var(--muted);margin-left:3px}
.overview-value.overtime{color:var(--primary)}
.overview-label,.count-label{font-size:11px;color:var(--muted)}
.overview-counts{display:flex;gap:18px;margin-top:7px}
.overview-counts>div{display:flex;align-items:baseline;gap:4px}
.overview-counts span:first-child{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.today-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:9px 11px;margin-bottom:10px;flex:none}
.settings{margin-bottom:14px}
.history{flex:1;min-height:0;display:flex;flex-direction:column}
.actions{display:flex;gap:6px}
.actions button{flex:1;min-width:0;min-height:38px;padding:6px 4px;font-size:13px;white-space:nowrap}
.actions .primary-action{flex:1.8}
.actions #btnDiscard{background:transparent;color:var(--muted);font-size:12px}
button{
  border:0;border-radius:8px;font-size:14px;font-weight:600;padding:12px 10px;cursor:pointer;
  background:var(--primary);color:#fff;min-height:48px;transition:filter .15s, transform .05s;
}
button:active{transform:scale(.97)}
button:disabled{background:#cbd5e1;color:#64748b;cursor:not-allowed}
button.ghost{background:#edf3f0;color:var(--primary)}
button.green{background:var(--green)}
button.amber{background:var(--amber)}
button.red{background:var(--red)}
button.rest{background:#edf2f6;color:var(--blue)}
.today-status{font-size:13px;color:var(--muted);margin-bottom:6px}
.today-status b{color:var(--text)}
h2{font-size:15px;margin:0 0 10px;color:var(--text)}
.settings label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
.settings .row{display:flex;gap:10px}
.settings .field{flex:1}
.settings input{
  width:100%;border:1px solid var(--border);border-radius:8px;padding:11px 12px;font-size:16px;background:#fff;color:var(--text);
}
.settings input:focus{outline:2px solid var(--primary);outline-offset:1px}
.settings .hint{font-size:12px;color:var(--muted);margin:10px 0 0}
.records ul{list-style:none;margin:0;padding:0}
.record{display:flex;flex-direction:column;gap:4px;padding:9px 2px;border-bottom:1px solid var(--border)}
.record .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.badge{font-size:12px;font-weight:700;padding:2px 6px;border-radius:4px;color:#fff}
.badge.work{background:var(--primary)}
.badge.rest{background:var(--blue)}
.badge.off{background:var(--amber)}
.record .date{color:var(--muted);font-size:13px;flex:1}
.record-open{background:transparent;color:var(--primary);min-height:32px;padding:4px 2px;font-size:13px}
.record .meta{font-size:12px;color:var(--muted)}
.record .nums{font-size:13px;font-weight:600}
.record .nums .overtime-pos{color:var(--red)}
.record .nums .overtime-neg{color:var(--green)}
.empty{color:var(--muted);text-align:center;padding:22px 0;font-size:14px}
.footer-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.footer-actions button{min-height:36px;font-size:12px;padding:7px 3px;background:transparent;border:1px solid var(--border);color:var(--muted)}
.view-tabs{display:flex;gap:16px;border-bottom:1px solid var(--border);margin-bottom:6px;flex:none}
.tab{background:transparent;color:var(--muted);min-height:32px;padding:5px 2px;border-radius:0;font-size:13px}
.tab.active{background:transparent;color:var(--primary);box-shadow:inset 0 -2px var(--primary)}
.cal-stats{font-size:13px;color:var(--muted);margin-bottom:8px}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-week span{text-align:center;color:var(--muted);font-size:11px;padding:1px 0}
.cal-cell{position:relative;height:37px;min-height:0;padding:3px 1px;border:1px solid var(--border);border-radius:5px;background:#fff;color:var(--text);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.15}
.cal-cell.empty{border:0;background:transparent;box-shadow:none;padding:0}
.cal-cell span{font-size:9px;color:var(--muted)}
.cal-normal{background:#e9f4ee;border-color:#c4dfcf}
.cal-normal span{color:var(--green);font-weight:700}
.cal-off{background:#fbf1e6;border-color:#ecd4b8}
.cal-off span{color:var(--amber);font-weight:700}
.cal-rest{background:#edf2f8;border-color:#cbd9e6}
.cal-rest span{color:var(--blue);font-weight:700}
.cal-rest.cal-rest-work span{color:var(--red)}
.cal-overtime{background:#faedeb;border-color:#edc7c2}
.cal-overtime span{color:var(--red);font-weight:700}
.cal-today{outline:2px solid var(--primary);outline-offset:1px}
.cal-legend{display:flex;gap:10px;margin-top:5px;font-size:10px;color:var(--muted);flex-wrap:wrap}
.cal-legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:3px;vertical-align:0}
#viewList{min-height:0;overflow-y:auto;flex:1}
#viewCalendar{min-height:0;flex:1}
.modal-backdrop{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal-backdrop .dialog-body{background:#fff;border-radius:8px;width:min(92vw,440px);box-shadow:0 18px 50px rgba(17,24,39,.25);max-height:90vh;overflow:auto}
.dialog-body{padding:18px}
.dialog-body h3{margin:0 0 14px;font-size:17px}
.dialog-body label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
.dialog-body input,.dialog-body select{width:100%;border:1px solid var(--border);border-radius:8px;padding:11px 12px;font-size:16px;background:#fff;color:var(--text)}
.dialog-body .two{display:flex;gap:10px}
.dialog-body .two>div{flex:1}
.dialog-body label.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);margin-top:12px}
.dialog-body label.check input{width:auto;margin:0}
.dialog-actions{display:flex;gap:10px;margin-top:18px}
.dialog-actions button{flex:1}
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:#111827;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;
  transition:opacity .2s, transform .2s;z-index:50;max-width:90vw;
}
.toast.show{opacity:.95;transform:translateX(-50%) translateY(0)}
.hidden{display:none !important}
@media (max-width:360px){.wrap{padding-left:10px;padding-right:10px}.overview-value{font-size:24px}.overview-counts{gap:12px}.range-select{width:98px}}
@media (max-height:650px){.wrap{padding-top:6px;padding-bottom:6px}header{padding-bottom:5px}.today-panel{margin-bottom:6px}.overview{padding-bottom:7px;margin-bottom:5px}.overview-value{font-size:23px}.view-tabs{margin-bottom:3px}.cal-cell{height:31px}.cal-legend{margin-top:3px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>工时打卡</h1>
    <div class="header-tools">
      <div id="clock">--:--</div>
      <details class="tools-menu" id="toolsMenu">
        <summary aria-label="设置和数据" title="设置和数据">⋯</summary>
        <div class="tools-popover">
          <h2>设置</h2>
          <div class="settings">
            <div class="row">
              <div class="field"><label for="setNormal">每天正常工时(小时)</label><input id="setNormal" type="number" min="0.5" step="0.5" inputmode="decimal" /></div>
              <div class="field"><label for="setLunch">午休时长(分钟)</label><input id="setLunch" type="number" min="0" step="5" inputmode="numeric" /></div>
            </div>
            <div class="row" style="margin-top:10px">
              <div class="field"><label for="setRestDays">每月休息天数</label><input id="setRestDays" type="number" min="0" step="1" inputmode="numeric" /></div>
            </div>
            <p class="hint">休息日上班全部算加班；调休按正常工时抵扣。</p>
          </div>
          <div class="footer-actions">
            <button onclick="openRecordForm()">补录</button>
            <button onclick="exportData()">导出</button>
            <button onclick="document.getElementById('importFile').click()">导入</button>
            <button onclick="clearData()">清空</button>
          </div>
        </div>
      </details>
    </div>
  </header>

  <section class="today-panel">
    <div class="today-status" id="todayStatus">今天还没有打卡。</div>
    <div class="actions">
      <button id="btnIn" class="primary-action" onclick="clockIn()">上班打卡</button>
      <button id="btnOut" class="green primary-action hidden" onclick="clockOut()">下班打卡</button>
      <button id="btnRest" class="rest" onclick="recordRest()">休息</button>
      <button id="btnOff" class="amber" onclick="recordOff()">调休</button>
      <button id="btnRecover" class="ghost primary-action hidden" onclick="openActiveForm()">补记下班</button>
      <button id="btnDiscard" class="ghost hidden" onclick="discardActive()">放弃本次打卡</button>
      <button id="btnEditToday" class="ghost primary-action hidden" onclick="openRecordForm(recordForDate(todayStr()).id)">编辑今日记录</button>
    </div>
  </section>

  <section class="overview" id="overview">
    <div class="stats-head">
      <h2>工时概况</h2>
      <div class="month-control">
        <button class="month-nav" aria-label="上个月" onclick="changeMonth(-1)">‹</button>
        <select class="range-select" id="statsRange" aria-label="统计月份" onchange="selectStatsRange()"></select>
        <button class="month-nav" aria-label="下个月" onclick="changeMonth(1)">›</button>
      </div>
    </div>
    <div class="overview-hours">
      <div><span class="overview-value"><span id="statTotalHours">0</span><small>小时</small></span><span class="overview-label">综合工时</span></div>
      <div><span class="overview-value overtime"><span id="statOvertime">0</span><small>小时</small></span><span class="overview-label">加班余额</span></div>
    </div>
    <div class="overview-counts">
      <div><span id="statWorkDays">0</span><span class="count-label">上班</span></div>
      <div><span id="statRestDays">0</span><span class="count-label">休息</span></div>
      <div><span id="statOffDays">0</span><span class="count-label">调休</span></div>
    </div>
  </section>

  <section class="history">
    <div class="view-tabs">
      <button id="tabList" class="tab active" onclick="setView('list')">列表</button>
      <button id="tabCalendar" class="tab" onclick="setView('calendar')">日历</button>
    </div>
    <div id="viewList">
      <div class="records"><ul id="recordList"></ul></div>
    </div>
    <div id="viewCalendar" class="hidden">
      <div class="cal-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend">
        <span><i style="background:#21845b"></i>正常</span>
        <span><i style="background:#426d93"></i>休息</span>
        <span><i style="background:#a96928"></i>调休</span>
        <span><i style="background:#c74e46"></i>加班</span>
      </div>
    </div>
  </section>
  <input type="file" id="importFile" accept="application/json" class="hidden" onchange="importData(event)" />
</div>

<div class="modal-backdrop hidden" id="recordDialog">
  <div class="dialog-body">
    <h3 id="dialogTitle">补录记录</h3>
    <form id="recordForm" onsubmit="saveRecord(event)">
      <input type="hidden" id="fId" />
      <label for="fDate">日期</label>
      <input id="fDate" type="date" required />
      <label for="fType">类型</label>
      <select id="fType" onchange="toggleTypeFields()">
        <option value="work">上班</option>
        <option value="rest">休息日</option>
        <option value="off">调休</option>
      </select>
      <div id="restFields" class="hidden">
        <label class="check" for="fRestWorked"><input type="checkbox" id="fRestWorked" onchange="toggleTypeFields()" /> 这天有上班（工时全部算加班）</label>
      </div>
      <div id="workFields">
        <div class="two">
          <div><label for="fIn">上班时间</label><input id="fIn" type="time" /></div>
          <div><label for="fOut">下班时间</label><input id="fOut" type="time" /></div>
        </div>
        <label for="fLunch">午休时长(分钟)</label>
        <input id="fLunch" type="number" min="0" step="5" inputmode="numeric" />
      </div>
      <div id="normalFields">
        <label for="fNormal">正常工时(小时)</label>
        <input id="fNormal" type="number" min="0.5" step="0.5" inputmode="decimal" />
      </div>
      <div class="cal-stats" id="recordPreview" aria-live="polite"></div>
      <label for="fNote">备注(可选)</label>
      <input id="fNote" type="text" maxlength="60" placeholder="例如：加班、调休等" />
      <div class="dialog-actions">
        <button type="button" id="btnDeleteRecord" class="red hidden" onclick="deleteCurrentRecord()">删除</button>
        <button type="button" class="ghost" onclick="closeDialog()">取消</button>
        <button type="submit">保存</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
const STORE_KEY = 'workhour.v1';
const DEFAULT_SETTINGS = { normalHours: 8, lunchMinutes: 30, restDaysPerMonth: 4 };

let state = loadState();
let currentView = 'calendar';
const initNow = new Date();
let calendarCursor = { year: initNow.getFullYear(), month: initNow.getMonth() + 1 };
let selectedPeriod = todayStr(initNow).slice(0, 7);

/* ---------- storage ---------- */
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && typeof s === 'object'){
        s.settings = Object.assign({}, DEFAULT_SETTINGS, s.settings || {});
        s.records = Array.isArray(s.records) ? s.records : [];
        s.active = s.active || null;
        return s;
      }
    }
  }catch(e){}
  return { settings: Object.assign({}, DEFAULT_SETTINGS), records: [], active: null };
}
function save(){
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
  render();
}

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function pad(n){ return String(n).padStart(2,'0'); }
function todayStr(d){
  d = d || new Date();
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
function nowHM(){
  const d = new Date();
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function hmToMin(hm){
  const parts = String(hm || '').split(':').map(Number);
  if(parts.length !== 2 || parts.some(isNaN)) return NaN;
  return parts[0]*60 + parts[1];
}
function round2(n){ return Math.round(n*100)/100; }
function fmtHours(h){ return String(round2(h)); }
function uid(){
  return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + '-' + Math.random().toString(16).slice(2));
}
function recordForDate(date){
  return state.records.find(r => r.date === date) || null;
}
function isRestWorked(r){
  return !!r && r.type === 'rest' && !!r.in && !!r.out;
}
function computeDuration(r){
  if(r.type === 'off') return round2(-Number(r.normalHours));
  if(r.type === 'rest' && !isRestWorked(r)) return 0;
  const diff = hmToMin(r.out) - hmToMin(r.in) - Number(r.lunchMinutes || 0);
  return round2(diff / 60);
}
function overtimeDelta(r){
  if(r.type === 'off') return round2(-Number(r.normalHours));
  if(r.type === 'rest') return computeDuration(r);
  return round2(computeDuration(r) - Number(r.normalHours));
}
function computeStats(range){
  let workDays=0, offDays=0, restDays=0, totalHours=0, overtime=0, normalWorkHours=0;
  for(const r of state.records){
    if(range !== 'all' && r.date.slice(0, 7) !== range) continue;
    const d = computeDuration(r);
    totalHours += d;
    overtime += overtimeDelta(r);
    if(r.type === 'work'){ workDays++; normalWorkHours += Number(r.normalHours); }
    else if(r.type === 'rest'){ restDays++; }
    else { offDays++; }
  }
  return { workDays, offDays, restDays, normalWorkHours: round2(normalWorkHours), totalHours: round2(totalHours), overtime: round2(overtime) };
}
/* ---------- actions ---------- */
function clockIn(){
  const today = todayStr();
  if(state.active){
    toast(state.active.date === today ? '今天已经打过上班卡了' : '请先处理 ' + state.active.date + ' 的未下班记录');
    return;
  }
  if(recordForDate(today)){
    toast('今天已有记录，请编辑或删除后重试');
    return;
  }
  state.active = {
    date: today,
    clockIn: nowHM(),
    normalHours: Number(state.settings.normalHours),
    lunchMinutes: Number(state.settings.lunchMinutes)
  };
  save();
  toast('上班打卡成功 ' + state.active.clockIn);
}
function clockOut(){
  if(!state.active){
    toast('请先打上班卡');
    return;
  }
  if(state.active.date !== todayStr()){
    toast('上次上班打卡是 ' + state.active.date + '，请先编辑或删除该记录再重新打卡');
    return;
  }
  const out = nowHM();
  if(hmToMin(out) <= hmToMin(state.active.clockIn)){
    toast('下班时间需晚于上班时间，请检查时间');
    return;
  }
  if(hmToMin(out) - hmToMin(state.active.clockIn) <= state.active.lunchMinutes){
    toast('工作时段需长于午休时长');
    return;
  }
  state.records.unshift({
    id: uid(),
    date: state.active.date,
    type: 'work',
    in: state.active.clockIn,
    out: out,
    lunchMinutes: state.active.lunchMinutes,
    normalHours: state.active.normalHours,
    note: ''
  });
  state.active = null;
  setSelectedMonth(todayStr().slice(0, 7));
  save();
  toast('下班打卡成功 ' + out);
}
function openActiveForm(){
  if(!state.active) return;
  openRecordForm(null, state.active.date);
  $('fIn').value = state.active.clockIn;
  $('fOut').value = state.active.date === todayStr() ? nowHM() : '17:00';
  $('fLunch').value = state.active.lunchMinutes;
  $('fNormal').value = state.active.normalHours;
  updateRecordPreview();
}
function discardActive(){
  if(!state.active || !confirm('放弃 ' + state.active.date + ' 的上班打卡？')) return;
  state.active = null;
  save();
  toast('已放弃未完成打卡');
}
function recordRest(){
  const today = todayStr();
  if(state.active){ toast('请先完成下班打卡'); return; }
  if(recordForDate(today)){ toast('今天已有记录，请编辑或删除后重试'); return; }
  if(!confirm('把今天记为休息日？工时 0，不扣调休时长。')) return;
  state.records.unshift({ id: uid(), date: today, type: 'rest', normalHours: 0, note: '休息' });
  setSelectedMonth(today.slice(0, 7));
  save();
  toast('已记录休息日');
}
function recordOff(){
  const today = todayStr();
  if(state.active){ toast('请先完成下班打卡'); return; }
  if(recordForDate(today)){ toast('今天已有记录，请编辑或删除后重试'); return; }
  const normalHours = Number(state.settings.normalHours);
  if(!confirm('把今天记为调休？将记录 ' + fmtHours(-normalHours) + ' 小时。')) return;
  state.records.unshift({
    id: uid(),
    date: today,
    type: 'off',
    normalHours: normalHours,
    note: '调休'
  });
  setSelectedMonth(today.slice(0, 7));
  save();
  toast('已记录调休 ' + fmtHours(-normalHours) + ' 小时');
}

/* ---------- record form ---------- */
function openRecordForm(id, date){
  $('toolsMenu').open = false;
  $('dialogTitle').textContent = id ? '编辑记录' : '补录记录';
  $('fId').value = id || '';
  const rec = id ? state.records.find(r => r.id === id) : null;
  $('fDate').value = rec ? rec.date : (date || todayStr());
  $('fType').value = rec ? rec.type : 'work';
  $('fIn').value = (rec && rec.in) ? rec.in : '07:00';
  $('fOut').value = (rec && rec.out) ? rec.out : '17:00';
  $('fLunch').value = rec ? (rec.lunchMinutes != null ? rec.lunchMinutes : state.settings.lunchMinutes) : state.settings.lunchMinutes;
  $('fNormal').value = (rec && rec.type !== 'rest') ? rec.normalHours : state.settings.normalHours;
  $('fRestWorked').checked = isRestWorked(rec);
  $('fNote').value = rec ? (rec.note || '') : '';
  toggleTypeFields();
  $('btnDeleteRecord').classList.toggle('hidden', !id);
  $('recordDialog').classList.remove('hidden');
}
function closeDialog(){ $('recordDialog').classList.add('hidden'); }
function toggleTypeFields(){
  const type = $('fType').value;
  const isRest = type === 'rest';
  const isWork = type === 'work';
  const restWorked = isRest && $('fRestWorked').checked;
  $('restFields').classList.toggle('hidden', !isRest);
  $('workFields').classList.toggle('hidden', !(isWork || restWorked));
  $('normalFields').classList.toggle('hidden', isRest);
  $('fIn').required = isWork || restWorked;
  $('fOut').required = isWork || restWorked;
  updateRecordPreview();
}
function updateRecordPreview(){
  const type = $('fType').value;
  const preview = $('recordPreview');
  if(type === 'off'){
    preview.textContent = '调休抵扣 ' + fmtHours(Number($('fNormal').value) || 0) + ' 小时';
    return;
  }
  if(type === 'rest' && !$('fRestWorked').checked){
    preview.textContent = '工时 0 小时';
    return;
  }
  const duration = (hmToMin($('fOut').value) - hmToMin($('fIn').value) - Number($('fLunch').value || 0)) / 60;
  if(!Number.isFinite(duration) || duration <= 0){
    preview.textContent = '请检查上下班时间与午休时长';
    return;
  }
  const overtime = type === 'rest' ? duration : duration - Number($('fNormal').value || 0);
  preview.textContent = '实际 ' + fmtHours(duration) + ' 小时 · 加班 ' + (overtime > 0 ? '+' : '') + fmtHours(overtime) + ' 小时';
}
function saveRecord(e){
  e.preventDefault();
  const id = $('fId').value;
  const date = $('fDate').value;
  const type = $('fType').value;
  if(!date){ toast('请选择日期'); return; }
  const dup = state.records.find(r => r.date === date && r.id !== id);
  if(dup){ toast('该日期已有记录，请先编辑或删除'); return; }

  let rec;
  if(type === 'rest'){
    if($('fRestWorked').checked){
      const tin = $('fIn').value, tout = $('fOut').value;
      if(!tin || !tout){ toast('请填写上下班时间'); return; }
      if(hmToMin(tout) <= hmToMin(tin)){ toast('下班时间需晚于上班时间'); return; }
      const lunch = Math.max(0, Number($('fLunch').value) || 0);
      if(hmToMin(tout) - hmToMin(tin) <= lunch){ toast('午休时长不能超过工作时段'); return; }
      rec = { id: id || uid(), date, type: 'rest', in: tin, out: tout, lunchMinutes: lunch, normalHours: 0, note: $('fNote').value.trim() };
    }else{
      rec = { id: id || uid(), date, type: 'rest', normalHours: 0, note: $('fNote').value.trim() };
    }
  }else{
    const normalHours = Number($('fNormal').value);
    if(!(normalHours > 0)){ toast('正常工时需大于 0'); return; }
    if(type === 'work'){
      const tin = $('fIn').value, tout = $('fOut').value;
      if(!tin || !tout){ toast('请填写上下班时间'); return; }
      if(hmToMin(tout) <= hmToMin(tin)){ toast('下班时间需晚于上班时间'); return; }
      const lunch = Math.max(0, Number($('fLunch').value) || 0);
      if(hmToMin(tout) - hmToMin(tin) <= lunch){ toast('午休时长不能超过工作时段'); return; }
      rec = { id: id || uid(), date, type, in: tin, out: tout, lunchMinutes: lunch, normalHours, note: $('fNote').value.trim() };
    }else{
      rec = { id: id || uid(), date, type, normalHours, note: $('fNote').value.trim() };
    }
  }

  if(id){
    const idx = state.records.findIndex(r => r.id === id);
    if(idx >= 0) state.records[idx] = rec;
  }else{
    state.records.unshift(rec);
  }
  if(state.active && state.active.date === date) state.active = null;
  setSelectedMonth(date.slice(0, 7));
  closeDialog();
  save();
  toast('已保存');
}
function deleteCurrentRecord(){ deleteRecord($('fId').value); }
function deleteRecord(id){
  const rec = state.records.find(r => r.id === id);
  if(!rec) return;
  if(!confirm('删除 ' + rec.date + ' 的记录？')) return;
  state.records = state.records.filter(r => r.id !== id);
  if(state.active && state.active.date === rec.date) state.active = null;
  closeDialog();
  save();
  toast('已删除');
}

/* ---------- settings ---------- */
function settingsChanged(){
  const n = Number($('setNormal').value);
  const l = Number($('setLunch').value);
  const r = Number($('setRestDays').value);
  if(!(n > 0)){ toast('正常工时需大于 0'); renderSettings(); return; }
  if(isNaN(l) || l < 0){ toast('午休时长不能为负'); renderSettings(); return; }
  if(isNaN(r) || r < 0 || r % 1 !== 0){ toast('每月休息天数需为非负整数'); renderSettings(); return; }
  state.settings.normalHours = n;
  state.settings.lunchMinutes = l;
  state.settings.restDaysPerMonth = r;
  save();
}
function renderSettings(){
  $('setNormal').value = state.settings.normalHours;
  $('setLunch').value = state.settings.lunchMinutes;
  $('setRestDays').value = state.settings.restDaysPerMonth;
}

/* ---------- import/export/clear ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '工时打卡备份-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('已导出备份');
}
function validDate(value){
  return typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value)
    && todayStr(new Date(value + 'T00:00:00')) === value;
}
function validTime(value){ return typeof value === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(value); }
function validRecord(r){
  if(!r || typeof r !== 'object' || typeof r.id !== 'string'
    || !/^[a-zA-Z0-9-]+$/.test(r.id)
    || !validDate(r.date) || !['work', 'rest', 'off'].includes(r.type)
    || typeof r.note !== 'string') return false;
  if(r.type === 'off') return Number.isFinite(r.normalHours) && r.normalHours > 0;
  if(r.type === 'rest' && !r.in && !r.out) return true;
  return validTime(r.in) && validTime(r.out)
    && Number.isFinite(r.lunchMinutes) && r.lunchMinutes >= 0
    && hmToMin(r.out) - hmToMin(r.in) > r.lunchMinutes
    && (r.type === 'rest' || (Number.isFinite(r.normalHours) && r.normalHours > 0));
}
function importData(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.records)){
        toast('文件格式不正确');
        return;
      }
      const settings = Object.assign({}, DEFAULT_SETTINGS, data.settings || {});
      const active = data.active || null;
      const dates = new Set(), ids = new Set();
      const valid = Number.isFinite(settings.normalHours) && settings.normalHours > 0
        && Number.isFinite(settings.lunchMinutes) && settings.lunchMinutes >= 0
        && Number.isInteger(settings.restDaysPerMonth) && settings.restDaysPerMonth >= 0
        && data.records.every(r => {
          if(!validRecord(r) || dates.has(r.date) || ids.has(r.id)) return false;
          dates.add(r.date); ids.add(r.id); return true;
        })
        && (!active || (validDate(active.date) && validTime(active.clockIn)
          && Number.isFinite(active.normalHours) && active.normalHours > 0
          && Number.isFinite(active.lunchMinutes) && active.lunchMinutes >= 0
          && !dates.has(active.date)));
      if(!valid){ toast('备份中有无效或重复的记录'); return; }
      if(!confirm('导入 ' + data.records.length + ' 条记录并覆盖当前数据？')) return;
      data.settings = settings;
      data.active = active;
      state = data;
      save();
      toast('导入成功');
    }catch(err){
      toast('文件读取失败');
    }
  };
  reader.readAsText(file, 'utf-8');
}
function clearData(){
  if(!confirm('清空所有打卡记录和设置？此操作不可恢复。')) return;
  state = { settings: Object.assign({}, DEFAULT_SETTINGS), records: [], active: null };
  save();
  toast('已清空');
}

/* ---------- render ---------- */
function renderPeriodOptions(){
  const select = $('statsRange');
  const months = new Set([todayStr().slice(0, 7), selectedPeriod]);
  for(const r of state.records) months.add(r.date.slice(0, 7));
  select.replaceChildren(new Option('全部记录', 'all'));
  for(const month of [...months].filter(m => /^\d{4}-\d{2}$/.test(m)).sort().reverse()){
    select.add(new Option(Number(month.slice(0, 4)) + '年' + Number(month.slice(5)) + '月', month));
  }
  select.value = selectedPeriod;
}
function selectStatsRange(){
  const period = $('statsRange').value;
  if(period === 'all'){
    selectedPeriod = 'all';
    setView('list');
  }
  else setSelectedMonth(period);
  render();
}
function setSelectedMonth(month){
  selectedPeriod = month;
  calendarCursor.year = Number(month.slice(0, 4));
  calendarCursor.month = Number(month.slice(5));
}
function render(){
  const today = todayStr();
  renderPeriodOptions();
  const stats = computeStats(selectedPeriod);
  $('statWorkDays').textContent = stats.workDays;
  $('statOffDays').textContent = stats.offDays;
  $('statRestDays').textContent = selectedPeriod === 'all' ? stats.restDays : stats.restDays + '/' + state.settings.restDaysPerMonth;
  $('statTotalHours').textContent = fmtHours(stats.totalHours);
  $('statOvertime').textContent = (stats.overtime > 0 ? '+' : '') + fmtHours(stats.overtime);

  const active = state.active;
  const todayRec = recordForDate(today);
  const status = $('todayStatus');
  if(active){
    const activeLabel = active.date === today ? '已上班打卡' : '上次上班打卡(' + active.date + ')';
    status.innerHTML = activeLabel + ' <b>' + active.clockIn + '</b>。';
  }else if(todayRec){
    const d = computeDuration(todayRec);
    const label = todayRec.type === 'work' ? '上班' : (todayRec.type === 'rest' ? '休息' : '调休');
    status.innerHTML = '今日已记录：<b>' + label + '</b>，时长 <b>' + fmtHours(d) + '</b> 小时。';
  }else{
    status.textContent = '今天还没有打卡。';
  }
  const fresh = !active && !todayRec;
  $('btnIn').classList.toggle('hidden', !fresh);
  $('btnRest').classList.toggle('hidden', !fresh);
  $('btnOff').classList.toggle('hidden', !fresh);
  $('btnOut').classList.toggle('hidden', !active || active.date !== today);
  $('btnRecover').classList.toggle('hidden', !active || active.date === today);
  $('btnDiscard').classList.toggle('hidden', !active);
  $('btnEditToday').classList.toggle('hidden', !todayRec || !!active);

  renderSettings();
  renderRecords();
  renderCalendar();
}
function renderRecords(){
  const list = $('recordList');
  const records = selectedPeriod === 'all' ? state.records : state.records.filter(r => r.date.slice(0, 7) === selectedPeriod);
  if(!records.length){
    list.innerHTML = '<li class="empty">' + (state.records.length ? '该月暂无记录' : '暂无记录，点击上方按钮开始打卡') + '</li>';
    return;
  }
  const sorted = records.slice().sort((a,b) => b.date.localeCompare(a.date));
  list.innerHTML = sorted.map(r => {
    const d = computeDuration(r);
    const o = overtimeDelta(r);
    let badge, meta;
    if(r.type === 'work'){
      badge = '<span class="badge work">上班</span>';
      meta = r.in + ' - ' + r.out + ' · 午休 ' + r.lunchMinutes + ' 分';
    }else if(r.type === 'rest'){
      badge = '<span class="badge rest">休息</span>';
      meta = isRestWorked(r)
        ? r.in + ' - ' + r.out + ' · 午休 ' + r.lunchMinutes + ' 分 · 休息日加班(全部算加班)'
        : '休息日 · 正常工时 0 小时';
    }else{
      badge = '<span class="badge off">调休</span>';
      meta = '正常工时 ' + fmtHours(r.normalHours) + ' 小时';
    }
    if(r.note) meta += ' · ' + r.note;
    const oCls = o > 0 ? 'overtime-pos' : 'overtime-neg';
    return '<li class="record">'
      + '<div class="top">' + badge + '<span class="date">' + r.date + '</span>'
      + '<button class="record-open" onclick="openRecordForm(\'' + r.id + '\')" aria-label="编辑 ' + r.date + ' 的记录">查看</button></div>'
      + '<div class="meta">' + escapeHtml(meta) + '</div>'
      + '<div class="nums">时长 ' + fmtHours(d) + ' 小时 · 加班 <span class="' + oCls + '">' + (o > 0 ? '+' : '') + fmtHours(o) + '</span> 小时</div>'
      + '</li>';
  }).join('');
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- calendar ---------- */
function setView(v){
  if(v === 'calendar' && selectedPeriod === 'all'){
    setSelectedMonth(calendarCursor.year + '-' + pad(calendarCursor.month));
    render();
  }
  currentView = v;
  $('tabList').classList.toggle('active', v === 'list');
  $('tabCalendar').classList.toggle('active', v === 'calendar');
  $('viewList').classList.toggle('hidden', v !== 'list');
  $('viewCalendar').classList.toggle('hidden', v !== 'calendar');
}
function changeMonth(delta){
  calendarCursor.month += delta;
  if(calendarCursor.month > 12){ calendarCursor.month = 1; calendarCursor.year += 1; }
  else if(calendarCursor.month < 1){ calendarCursor.month = 12; calendarCursor.year -= 1; }
  setSelectedMonth(calendarCursor.year + '-' + pad(calendarCursor.month));
  render();
}
function dayStatus(rec){
  if(!rec) return null;
  if(rec.type === 'off') return 'off';
  if(rec.type === 'rest') return isRestWorked(rec) ? 'restWork' : 'rest';
  return overtimeDelta(rec) > 0 ? 'overtime' : 'normal';
}
function renderCalendar(){
  const y = calendarCursor.year;
  const m = calendarCursor.month;
  const firstDow = (new Date(y, m - 1, 1).getDay() + 6) % 7;
  const days = new Date(y, m, 0).getDate();
  let html = '';
  for(let i = 0; i < firstDow; i++){ html += '<div class="cal-cell empty"></div>'; }
  for(let d = 1; d <= days; d++){
    const ds = y + '-' + pad(m) + '-' + pad(d);
    const rec = recordForDate(ds);
    const st = dayStatus(rec);
    let cls = 'cal-cell';
    let label = '';
    if(st === 'off'){ cls += ' cal-off'; label = '调'; }
    else if(st === 'rest'){ cls += ' cal-rest'; label = '休'; }
    else if(st === 'restWork'){ cls += ' cal-rest cal-rest-work'; label = '加'; }
    else if(st === 'overtime'){ cls += ' cal-overtime'; label = '加'; }
    else if(st === 'normal'){ cls += ' cal-normal'; label = '班'; }
    if(ds === todayStr()){ cls += ' cal-today'; }
    html += '<button class="' + cls + '" onclick="openDay(\'' + ds + '\')">' + d + '<span>' + label + '</span></button>';
  }
  const cells = Math.ceil((firstDow + days) / 7) * 7;
  for(let i = firstDow + days; i < cells; i++) html += '<div class="cal-cell empty"></div>';
  $('calGrid').innerHTML = html;
}
function openDay(dateStr){
  const rec = recordForDate(dateStr);
  if(rec){ openRecordForm(rec.id); }
  else { openRecordForm(null, dateStr); }
}

/* ---------- clock & toast ---------- */
function tick(){
  const d = new Date();
  $('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  if(todayStr(d) !== lastRenderedDate){ lastRenderedDate = todayStr(d); render(); }
}
let lastRenderedDate = todayStr();
let toastTimer = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ---------- init ---------- */
$('setNormal').addEventListener('change', settingsChanged);
$('setLunch').addEventListener('change', settingsChanged);
$('setRestDays').addEventListener('change', settingsChanged);
for(const id of ['fIn', 'fOut', 'fLunch', 'fNormal']) $(id).addEventListener('input', updateRecordPreview);
document.addEventListener('click', event => {
  if(!$('toolsMenu').contains(event.target)) $('toolsMenu').open = false;
});
setView('calendar');
tick();
setInterval(tick, 1000);
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
